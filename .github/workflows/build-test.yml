name: Build and Test
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - "functions/**"
  workflow_call:
    inputs:
      SKIP_TESTS:
        description: The skip test parameter is useful for DEV environment deployments, not advised for QA and PROD.
        required: false
        type: boolean
        default: false

env:
  python_version: '3.11'
  java_version: '11' # needed by setup-openapi-generator.sh
  liquibase_version: '4.33.0'

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Build & Setup
    outputs:
      should-run-tests: ${{ steps.set-should-run-tests.outputs.result }}
      test-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set whether to run tests
        id: set-should-run-tests
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_call" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUTS_SKIP_TESTS" == "false" ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_SKIP_TESTS: ${{ inputs.SKIP_TESTS }}

      - name: Extract commit hash and version from git
        run: ./scripts/extract-hash-and-version.sh

      - name: Set up JDK ${{ env.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}

      - name: Cache lint virtualenvs
        uses: actions/cache@v6
        with:
          path: |
            api/venv
            functions-python/venv
            integration-tests/venv
          key: lint-venvs-${{ runner.os }}-${{ hashFiles('api/requirements_dev.txt', 'functions-python/requirements_dev.txt', 'integration-tests/requirements_dev.txt') }}

      - name: Docker Compose DB
        run: |
          docker compose --env-file ./config/.env.local up -d postgres postgres-test
        working-directory: ${{ github.workspace }}

      - name: Run lint checks
        if: ${{ steps.set-should-run-tests.outputs.result == 'true' }}
        shell: bash
        run: |
          scripts/lint-tests.sh

      - name: Cache Liquibase
        id: cache-liquibase
        uses: actions/cache@v6
        with:
          path: ~/.liquibase
          key: liquibase-${{ env.liquibase_version }}

      - name: Install Liquibase
        if: steps.cache-liquibase.outputs.cache-hit != 'true'
        env:
          LIQUIBASE_VERSION: ${{ env.liquibase_version }}
        run: |
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz -o liquibase.tar.gz
          rm -rf liquibase-dist
          mkdir liquibase-dist
          tar -xzf liquibase.tar.gz -C liquibase-dist
          mv liquibase-dist ~/.liquibase

      - name: Link Liquibase
        run: |
          sudo ln -sf ~/.liquibase/liquibase /usr/local/bin/liquibase
          liquibase --version

      - name: Run Liquibase on Python functions test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/MobilityDatabaseTest
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      - name: Run Liquibase on users test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog_user.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/${POSTGRES_USER_TEST_DB:-MobilityDatabaseUsersTest}
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      - name: Generate DB code
        run: |
          export USE_TEST_DB=true
          scripts/db-gen.sh
          scripts/db-gen-user.sh

      - name: Generate API code
        run: |
          scripts/setup-openapi-generator.sh
          scripts/api-gen.sh
          scripts/api-user-service-gen.sh

      - name: Generate Operations API code
        run: |
          scripts/api-operations-gen.sh

      - name: Set test matrix
        id: set-matrix
        run: python3 scripts/generate_test_matrix.py

      - name: Upload DB models
        uses: actions/upload-artifact@v7
        with:
          name: database_gen
          path: api/src/shared/database_gen/
          overwrite: true

      - name: Upload users DB models
        uses: actions/upload-artifact@v7
        with:
          name: users_database_gen
          path: api/src/shared/users_database_gen/
          overwrite: true

      - name: Upload API generated code
        uses: actions/upload-artifact@v7
        with:
          name: feeds_gen
          path: api/src/feeds_gen/
          overwrite: true

      - name: Upload User Service API generated code
        uses: actions/upload-artifact@v7
        with:
          name: user_service_gen
          path: api/src/user_service_gen/
          overwrite: true

      - name: Upload Operations API generated code
        uses: actions/upload-artifact@v7
        with:
          name: feeds_operations_gen
          path: functions-python/operations_api/src/feeds_gen/
          overwrite: true

  test:
    needs: setup
    if: ${{ needs.setup.outputs.should-run-tests == 'true' }}
    runs-on: ubuntu-latest
    permissions: write-all
    name: Test (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.test-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}

      - name: Download DB models
        uses: actions/download-artifact@v8
        with:
          name: database_gen
          path: api/src/shared/database_gen/

      - name: Download users DB models
        uses: actions/download-artifact@v8
        with:
          name: users_database_gen
          path: api/src/shared/users_database_gen/

      - name: Download API generated code
        uses: actions/download-artifact@v8
        with:
          name: feeds_gen
          path: api/src/feeds_gen/

      - name: Download User Service API generated code
        uses: actions/download-artifact@v8
        with:
          name: user_service_gen
          path: api/src/user_service_gen/

      - name: Download Operations API generated code
        uses: actions/download-artifact@v8
        with:
          name: feeds_operations_gen
          path: functions-python/operations_api/src/feeds_gen/

      - name: Docker Compose DB
        run: |
          docker compose --env-file ./config/.env.local up -d postgres-test --wait
        working-directory: ${{ github.workspace }}

      - name: Set up JDK ${{ env.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'

      - name: Cache Liquibase
        id: cache-liquibase
        uses: actions/cache@v6
        with:
          path: ~/.liquibase
          key: liquibase-${{ env.liquibase_version }}

      - name: Install Liquibase
        if: steps.cache-liquibase.outputs.cache-hit != 'true'
        env:
          LIQUIBASE_VERSION: ${{ env.liquibase_version }}
        run: |
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz -o liquibase.tar.gz
          rm -rf liquibase-dist
          mkdir liquibase-dist
          tar -xzf liquibase.tar.gz -C liquibase-dist
          mv liquibase-dist ~/.liquibase

      - name: Link Liquibase
        run: sudo ln -sf ~/.liquibase/liquibase /usr/local/bin/liquibase

      - name: Run Liquibase on test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/MobilityDatabaseTest
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      - name: Run Liquibase on users test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog_user.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/${POSTGRES_USER_TEST_DB:-MobilityDatabaseUsersTest}
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      - name: Run tests
        shell: bash
        run: >
          scripts/api-tests.sh --folder ${{ matrix.folder }}
          --test_paths "${{ matrix.test_paths }}" --skip_coverage_gate --html_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage_report_${{ matrix.group }}
          path: scripts/coverage_reports/
          overwrite: true

      # Raw coverage data (not the human-readable report above), uploaded separately so the
      # coverage-gate job below can find every shard's data via the coverage_data_* name
      # pattern and combine them back into one report per target before enforcing the
      # threshold. --skip_coverage_gate above means this job never fails on coverage alone;
      # the combined figure, checked once per target, is what's authoritative.
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage_data_${{ matrix.group }}
          path: scripts/coverage_reports/*/coverage.dat
          overwrite: true

  coverage-gate:
    needs: [setup, test]
    if: ${{ needs.setup.outputs.should-run-tests == 'true' }}
    runs-on: ubuntu-latest
    name: Coverage gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}

      # One subdirectory per artifact (the default), so every shard's identically-named
      # coverage.dat lands at coverage_data/coverage_data_<group>/coverage.dat instead of
      # clobbering its siblings.
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage_data_*
          path: coverage_data
          merge-multiple: false

      - name: Combine shards and check threshold per target
        env:
          MATRIX_JSON: ${{ needs.setup.outputs.test-matrix }}
          COVERAGE_DOWNLOAD_DIR: coverage_data
        run: python3 scripts/check_combined_coverage.py

  operations-api-surface:
    needs: setup
    if: ${{ needs.setup.outputs.should-run-tests == 'true' }}
    runs-on: ubuntu-latest
    name: Operations API surface
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}

      - name: Download Operations API generated code
        uses: actions/download-artifact@v8
        with:
          name: feeds_operations_gen
          path: functions-python/operations_api/src/feeds_gen/

      # The app imports the generated SQLAlchemy models via the shared symlinks
      # (shared.database_gen / shared.users_database_gen), so those artifacts must
      # be present for the server to start.
      - name: Download DB models
        uses: actions/download-artifact@v8
        with:
          name: database_gen
          path: api/src/shared/database_gen/

      - name: Download users DB models
        uses: actions/download-artifact@v8
        with:
          name: users_database_gen
          path: api/src/shared/users_database_gen/

      - name: Docker Compose DB
        run: docker compose --env-file ./config/.env.local up -d postgres-test --wait
        working-directory: ${{ github.workspace }}

      - name: Set up JDK ${{ env.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java_version }}
          distribution: 'temurin'

      - name: Cache Liquibase
        id: cache-liquibase
        uses: actions/cache@v6
        with:
          path: ~/.liquibase
          key: liquibase-${{ env.liquibase_version }}

      - name: Install Liquibase
        if: steps.cache-liquibase.outputs.cache-hit != 'true'
        env:
          LIQUIBASE_VERSION: ${{ env.liquibase_version }}
        run: |
          curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz -o liquibase.tar.gz
          rm -rf liquibase-dist
          mkdir liquibase-dist
          tar -xzf liquibase.tar.gz -C liquibase-dist
          mv liquibase-dist ~/.liquibase

      - name: Link Liquibase
        run: sudo ln -sf ~/.liquibase/liquibase /usr/local/bin/liquibase

      - name: Run Liquibase on test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/MobilityDatabaseTest
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      - name: Run Liquibase on users test DB
        working-directory: ${{ github.workspace }}/liquibase
        run: |
          export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog_user.xml"
          export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:54320/${POSTGRES_USER_TEST_DB:-MobilityDatabaseUsersTest}
          export LIQUIBASE_COMMAND_USERNAME=postgres
          export LIQUIBASE_COMMAND_PASSWORD=postgres
          liquibase update

      # DB is already up + migrated by the steps above, so run with --no-docker.
      # The script provisions the venv/deps/symlinks, starts the API, and hits every endpoint.
      - name: Run Operations API surface suite
        shell: bash
        run: scripts/api-operations-surface.sh --no-docker
# Runs the integration tests on pull requests against an API started on the runner and a local
# database built from the branch's Liquibase changelogs. The database is seeded only from the
# committed files in integration-tests/fixtures, the same files the tests read, so every endpoint
# is checked against known data and two runs of the same commit test the same thing.
# No secrets are used, so the workflow also runs on pull requests from forks and Dependabot.
# The deployed environments only get the smoke tests, from integration-tests.yml.
name: PR - Run Integration Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integration-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  python_version: '3.11'
  java_version: '11' # needed by setup-openapi-generator.sh
  API_URL: 'http://localhost:8080'
  liquibase_version: '4.33.0'

jobs:
  # Path filtering is done in a job, not with `on.pull_request.paths`: a skipped job satisfies a
  # required status check, while a workflow filtered out by paths leaves the check pending.
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
    - name: Check changed files
      id: filter
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
          --paginate --jq '.[].filename')
        pattern='^(api/|liquibase/|integration-tests/|docs/(DatabaseCatalogAPI|UserServiceAPI|GarageAPI)(_IAP)?\.yaml$|config/|docker-compose\.yaml$|scripts/(api-|db-gen|integration-tests|setup-openapi-generator|extract-hash-and-version)|\.github/workflows/integration-tests-pr\.yml$)'
        if echo "$files" | grep -qE "$pattern"; then
          echo "api=true" >> "$GITHUB_OUTPUT"
        else
          echo "api=false" >> "$GITHUB_OUTPUT"
          echo "No API-related changes, skipping the integration tests."
        fi

  integration-tests-pr:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENVIRONMENT: local # never publish to Pub/Sub while seeding
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Extract commit hash and version from git
      run: ./scripts/extract-hash-and-version.sh

    - name: Set up Python ${{ env.python_version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.python_version }}

    - name: Set the fixture feeds file
      run: echo "FILE_PATH=$(realpath integration-tests/fixtures/sources.csv)" >> $GITHUB_ENV

    - name: Set up JDK ${{ env.java_version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.java_version }}
        distribution: 'temurin'

    - name: Docker Compose DB
      run: |
        docker compose --env-file ./config/.env.local up -d postgres
      working-directory: ${{ github.workspace }}

    - name: Install Liquibase
      env:
        LIQUIBASE_VERSION: ${{ env.liquibase_version }}
      run: |
        curl -sSL https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz -o liquibase.tar.gz
        rm -rf liquibase-dist
        mkdir liquibase-dist
        tar -xzf liquibase.tar.gz -C liquibase-dist
        sudo rm -rf /usr/local/liquibase
        sudo mv liquibase-dist /usr/local/liquibase
        sudo ln -sf /usr/local/liquibase/liquibase /usr/local/bin/liquibase
        liquibase --version

    - name: Run Liquibase on API local DB
      working-directory: ${{ github.workspace }}/liquibase
      run: |
        export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog.xml"
        export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:5432/MobilityDatabase
        export LIQUIBASE_COMMAND_USERNAME=postgres
        export LIQUIBASE_COMMAND_PASSWORD=postgres
        export LIQUIBASE_LOG_LEVEL=FINE

        liquibase update

    - name: Run Liquibase on users DB
      working-directory: ${{ github.workspace }}/liquibase
      run: |
        export LIQUIBASE_COMMAND_CHANGELOG_FILE="changelog_user.xml"
        export LIQUIBASE_COMMAND_URL=jdbc:postgresql://localhost:5432/${POSTGRES_USER_DB:-MobilityDatabaseUsers}
        export LIQUIBASE_COMMAND_USERNAME=postgres
        export LIQUIBASE_COMMAND_PASSWORD=postgres
        liquibase update

    - name: Generate code
      run: |
        scripts/db-gen.sh
        scripts/db-gen-user.sh
        scripts/setup-openapi-generator.sh
        scripts/api-gen.sh
        scripts/api-user-service-gen.sh
        scripts/api-garage-gen.sh

    - name: Seed database
      run: scripts/integration-tests-seed-db.sh "$FILE_PATH"

    - name: Start API
      run: |
        scripts/api-start.sh > api_logs.txt 2>&1 &
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null "${API_URL}/v1/metadata"; then
            echo "API is up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "API did not start within 60s"
        cat api_logs.txt
        exit 1

    - name: Health Check
      run: ./scripts/integration-tests.sh -u ${{ env.API_URL }} -f $FILE_PATH -c MetadataEndpointTests
      env:
        DUMMY_TOKEN: DUMMY_TOKEN

    # SmokeEndpointTests is for the deployed environments only (integration-tests.yml).
    - name: Run Integration Tests
      run: ./scripts/integration-tests.sh -u ${{ env.API_URL }} -f $FILE_PATH -x MetadataEndpointTests,SmokeEndpointTests
      env:
        DUMMY_TOKEN: DUMMY_TOKEN

    - name: Upload Test Logs
      if: ${{ always() }} # always upload the available logs even if the integration tests failed.
      uses: actions/upload-artifact@v7
      with:
        name: integration-tests-results
        path: |
          integration-tests/src/integration_tests_log.html
          api_logs.txt

# Convenience config for running the Liquibase CLI by hand against the test DB.
# The port below is the default. If this worktree has its own published port
# (see config/.env.worktree, generated by scripts/worktree-env.sh), substitute
# POSTGRES_TEST_PORT from that file into the url.
changeLogFile=../liquibase/changelog.xml
username=POSTGRES_USER
password=POSTGRES_PASSWORD
url= postgres://postgres:postgres@127.0.0.1:54320/MobilityDatabaseTest
driver=org.postgresql.Driver
logLevel=info
liquibase.hub.mode=off